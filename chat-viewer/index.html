<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Чат команды</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-new: #1d2a3a; --text: #e6e8ee;
    --muted: #8b93a5; --border: #262b36; --accent: #5aa9ff; --ok: #3ccf91; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: rgba(15,17,21,.95); border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 20px; flex: 1; }
  #status { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  #dot.ok { background: var(--ok); } #dot.err { background: var(--err); }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 15px; }
  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 80px; }
  .msg { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin: 0 0 12px; transition: background 3s; }
  .msg.new { background: var(--panel-new); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 15px; color: var(--muted); }
  .nick { color: var(--accent); font-weight: 600; font-size: 17px; }
  .tag { border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; font-size: 13px; }
  .tag.CLAIM { color: #ffcf5a; } .tag.DONE { color: var(--ok); } .tag.BLOCKED { color: var(--err); }
  .tag.QUESTION { color: #c792ff; } .tag.ANSWER { color: #7fd8ff; }
  .id { margin-left: auto; font-variant-numeric: tabular-nums; }
  .body { margin-top: 6px; overflow-wrap: anywhere; }
  .body p { margin: 6px 0; } .body ul { margin: 6px 0; padding-left: 22px; }
  code { background: #0b0d11; border-radius: 4px; padding: 1px 5px; font-size: .9em; }
  pre { background: #0b0d11; border-radius: 8px; padding: 10px; overflow-x: auto; }
  pre code { padding: 0; }
  #settings { display: none; max-width: 900px; margin: 0 auto; padding: 12px 16px; font-size: 15px; color: var(--muted); }
  #settings.open { display: block; }
  #settings input { width: 100%; margin: 6px 0; padding: 8px; font: inherit; background: var(--panel);
    color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
  #error { color: var(--err); font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1>Чат команды</h1>
  <div id="status"><span id="dot"></span><span id="statusText">загрузка…</span></div>
  <button id="refresh" title="Обновить сейчас">↻</button>
  <button id="gear" title="Настройки">⚙</button>
</header>
<div id="settings">
  Без токена GitHub разрешает 60 запросов в час, поэтому чат обновляется раз в минуту.
  С токеном (fine-grained, только чтение публичных репозиториев) — каждые 10 секунд.
  Токен хранится только в этом браузере.
  <input id="token" type="password" placeholder="GitHub token (необязательно)" autocomplete="off">
  <button id="saveToken">Сохранить</button>
</div>
<main>
  <div id="error"></div>
  <div id="list"></div>
</main>
<script>
(() => {
  const REPO = 'ttm545/b2baihacatondamirhuesos';
  const PATH = 'TEAM_CHAT.md';
  const BRANCH = 'main';
  const URL_API = `https://api.github.com/repos/${REPO}/contents/${PATH}?ref=${BRANCH}`;

  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
  };

  let etag = '';
  let seen = new Set();
  let firstLoad = true;
  let timer = null;
  let lastOk = null;

  const token = () => store.get('ghToken');
  const interval = () => (token() ? 10 : 60) * 1000;

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
  }
  // Minimal Markdown: paragraphs, bullet lists, fenced code, inline code/bold/links.
  function md(text) {
    const out = []; let para = []; let list = []; let code = null;
    const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    const flushList = () => { if (list.length) { out.push('<ul>' + list.map(i => '<li>' + inline(i) + '</li>').join('') + '</ul>'); list = []; } };
    for (const line of text.split('\n')) {
      if (code !== null) {
        if (/^```/.test(line)) { out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); code = null; }
        else code.push(line);
        continue;
      }
      if (/^```/.test(line)) { flushPara(); flushList(); code = []; continue; }
      const li = line.match(/^\s*[-*]\s+(.*)$/);
      if (li) { flushPara(); list.push(li[1]); continue; }
      if (!line.trim()) { flushPara(); flushList(); continue; }
      flushList(); para.push(line);
    }
    if (code !== null) out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
    flushPara(); flushList();
    return out.join('');
  }

  // Header: "### 2026-11-21 10:40 | NICK (Claude) → ALL | INFO | 010" — tolerant to missing parts.
  function parse(textMd) {
    const msgs = [];
    const re = /^###\s+(.+)$/gm;
    const heads = [];
    // Blank out fenced code blocks (same length) so example headers inside them are ignored.
    const scan = textMd.replace(/^```[\s\S]*?^```/gm, s => s.replace(/[^\n]/g, ' '));
    let m;
    while ((m = re.exec(scan))) heads.push({ line: m[1], start: m.index, end: re.lastIndex });
    heads.forEach((h, i) => {
      const parts = h.line.split('|').map(s => s.trim());
      if (parts.length < 2) return;
      const body = textMd.slice(h.end, i + 1 < heads.length ? heads[i + 1].start : undefined).trim();
      const [when, who = '', type = '', id = ''] = parts;
      const [from, to = ''] = who.split(/\s*(?:→|->)\s*/);
      const fm = from.match(/^(.*?)\s*(?:\(([^)]*)\))?$/);
      msgs.push({ when, nick: fm ? fm[1] : from, agent: fm && fm[2] || '', to, type, id, body,
        key: h.line });
    });
    return msgs;
  }

  function render(msgs) {
    const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 200;
    const html = msgs.map(x => {
      const isNew = !firstLoad && !seen.has(x.key);
      return `<article class="msg${isNew ? ' new' : ''}">
        <div class="meta">
          <span class="nick">${esc(x.nick)}</span>
          ${x.agent ? `<span>(${esc(x.agent)})</span>` : ''}
          ${x.to ? `<span>→ ${esc(x.to)}</span>` : ''}
          ${x.type ? `<span class="tag ${esc(x.type)}">${esc(x.type)}</span>` : ''}
          <span>${esc(x.when)}</span>
          ${x.id ? `<span class="id">#${esc(x.id)}</span>` : ''}
        </div>
        <div class="body">${md(x.body)}</div>
      </article>`;
    }).join('');
    $('list').innerHTML = html || '<p style="color:var(--muted)">Сообщений пока нет.</p>';
    const hadNew = !firstLoad && msgs.some(x => !seen.has(x.key));
    seen = new Set(msgs.map(x => x.key));
    if (firstLoad || (hadNew && nearBottom)) window.scrollTo(0, document.body.scrollHeight);
    if (hadNew) setTimeout(() => document.querySelectorAll('.msg.new').forEach(e => e.classList.remove('new')), 4000);
    firstLoad = false;
  }

  function setStatus(kind, text) {
    $('dot').className = kind;
    $('statusText').textContent = text;
  }
  function ago() {
    if (!lastOk) return;
    const s = Math.round((Date.now() - lastOk) / 1000);
    setStatus('ok', s < 5 ? 'обновлено только что' : `обновлено ${s} с назад`);
  }

  async function poll() {
    clearTimeout(timer);
    let wait = interval();
    try {
      const headers = { Accept: 'application/vnd.github.raw+json' };
      if (etag) headers['If-None-Match'] = etag;
      if (token()) headers.Authorization = 'Bearer ' + token();
      const r = await fetch(URL_API, { headers, cache: 'no-store' });
      if (r.status === 304) {
        lastOk = Date.now();
      } else if (r.ok) {
        etag = r.headers.get('ETag') || '';
        render(parse(await r.text()));
        lastOk = Date.now();
      } else if (r.status === 403 || r.status === 429) {
        const reset = Number(r.headers.get('X-RateLimit-Reset')) * 1000;
        wait = reset > Date.now() ? Math.min(reset - Date.now() + 2000, 15 * 60 * 1000) : 5 * 60 * 1000;
        throw new Error(`лимит GitHub исчерпан, повтор через ${Math.ceil(wait / 60000)} мин`);
      } else if (r.status === 401) {
        throw new Error('токен не подходит — проверьте его в настройках ⚙');
      } else {
        throw new Error('GitHub ответил ' + r.status);
      }
      $('error').textContent = '';
      ago();
    } catch (e) {
      setStatus('err', 'ошибка');
      $('error').textContent = (e && e.message) || String(e);
    }
    timer = setTimeout(poll, wait);
  }

  setInterval(ago, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  $('refresh').onclick = poll;
  $('gear').onclick = () => $('settings').classList.toggle('open');
  $('token').value = token();
  $('saveToken').onclick = () => { store.set('ghToken', $('token').value.trim()); etag = ''; $('settings').classList.remove('open'); poll(); };
  poll();
})();
</script>
</body>
</html>
